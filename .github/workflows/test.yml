name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Server tests
        run: npm run test:server

      - name: Desktop tests
        run: node --test desktop/state.test.mjs

      - name: Client tests
        run: npm run test:client

      - name: Build
        run: npm run build
