name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Package & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds for now: skip code-signing identity lookup on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach macOS installer script
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" scripts/install-mac.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
